name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: workflow gets read-only access to the repo by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    name: mcp-server build + build/ in sync
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build TypeScript
        run: npm run build
      - name: Verify committed build/ matches src/
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if ! git diff --ignore-cr-at-eol --exit-code -- mcp-server/build; then
            echo "::error::mcp-server/build is out of sync with mcp-server/src."
            echo "Run 'npm run build' inside mcp-server/ and commit the regenerated build/ directory."
            exit 1
          fi

  pty-host:
    name: pty-host tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pty-host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pty-host/package-lock.json
      - name: Install (node-pty native build runs here)
        run: npm ci
      - name: Run tests
        run: npm test

  # Node 20 is the floor the docs promise; this job guards the other end of the range.
  # It is deliberately a SEPARATE job rather than a matrix on "pty-host tests": that name is a
  # required status check in the "main protection" ruleset, and adding a matrix would rename it to
  # "pty-host tests (20)", so the required check would never report again and every PR would block.
  # Not required to pass, so a future Node quirk surfaces as a signal instead of a merge blocker.
  pty-host-node-latest:
    name: pty-host tests (Node 24)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: pty-host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pty-host/package-lock.json
      - name: Install (node-pty native build runs here)
        run: npm ci
      - name: Run tests
        run: npm test
